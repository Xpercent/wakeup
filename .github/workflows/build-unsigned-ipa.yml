name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archive without signing
        run: |
          xcodebuild -project WakeUp.xcodeproj -scheme WakeUp -configuration Release -sdk iphoneos -archivePath "$PWD/build/WakeUp.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/WakeUp.xcarchive/Products/Applications/WakeUp.app Payload/
          mkdir -p artifacts
          zip -qry artifacts/WakeUp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WakeUp-unsigned-ipa
          path: artifacts/WakeUp-unsigned.ipa
